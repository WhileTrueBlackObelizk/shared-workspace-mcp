name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Compile
        run: python -m py_compile server.py scripts/check_secrets.py scripts/install_claude_extension.py scripts/test_contract.py

      - name: Self-check
        run: python server.py --self-check

      - name: Contract tests
        run: python scripts/test_contract.py

  installer-smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n start.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Linux setup only
        run: ./start.sh --setup-only

      - name: Claude extension smoke
        run: |
          .venv/bin/python scripts/install_claude_extension.py \
            --claude-root "$RUNNER_TEMP/Claude" \
            --python "$PWD/.venv/bin/python" \
            --server "$PWD/server.py"
          test -f "$RUNNER_TEMP/Claude/Claude Extensions/ant.dir.whiletrueblackobelizk.shared-workspace-mcp/manifest.json"

      - name: Venv self-check
        run: .venv/bin/python server.py --self-check
