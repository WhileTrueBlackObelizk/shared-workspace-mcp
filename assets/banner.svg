<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Cairn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .stone { transform-box: fill-box; transform-origin: center; opacity: 0;
               animation: drop .7s cubic-bezier(.2,.8,.2,1) forwards; }
      .st4 { animation-delay:.10s } .st3 { animation-delay:.30s }
      .st2 { animation-delay:.50s } .st1 { animation-delay:.70s }
      .cairn { transform-box: fill-box; transform-origin: center;
               animation: bob 4.5s ease-in-out 1.3s infinite; }
      .title, .tag, .eyebrow { transform-box: fill-box; transform-origin: left center; opacity:0;
               animation: up 1s ease-out forwards; }
      .eyebrow { animation-delay:.25s } .title { animation-delay:.45s } .tag { animation-delay:.75s }
      .halo { animation: pulse 3.6s ease-in-out infinite; }
      .rule { stroke-dasharray: 360; stroke-dashoffset: 360; animation: draw 1.1s ease-out 1s forwards; }
      @keyframes drop { 0%{opacity:0;transform:translateY(-46px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes bob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes up   { 0%{opacity:0;transform:translateY(16px)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes pulse{ 0%,100%{opacity:.25} 50%{opacity:.6} }
      @keyframes draw { to { stroke-dashoffset: 0 } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <ellipse class="halo" cx="205" cy="170" rx="170" ry="150" fill="url(#halo)"/>

  <!-- cairn: stacked stones -->
  <g class="cairn">
    <ellipse class="stone st4" cx="205" cy="234" rx="74" ry="26" fill="#334155"/>
    <ellipse class="stone st3" cx="205" cy="190" rx="58" ry="22" fill="#3f4f68"/>
    <ellipse class="stone st2" cx="205" cy="152" rx="44" ry="18" fill="#4b5f7d"/>
    <ellipse class="stone st1" cx="205" cy="120" rx="30" ry="14" fill="url(#ink)"/>
  </g>

  <!-- wordmark -->
  <text class="eyebrow" x="372" y="92" font-size="22" letter-spacing="6" fill="#5eead4" font-weight="600">SHARED WORKSPACE · MCP</text>
  <text class="title" x="370" y="176" font-size="104" font-weight="800" fill="url(#ink)">Cairn</text>
  <line class="rule" x1="374" y1="196" x2="734" y2="196" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <text class="tag" x="374" y="240" font-size="27" fill="#94a3b8" font-weight="500">Shared memory &amp; verified handover for AI agents.</text>
</svg>
